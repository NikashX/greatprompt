[project]
name = "greatprompt"
version = "1.0.0"
description = "Turn a rough idea into a precise, expert-level prompt for any AI model."
license = "MIT"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["prompts.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S104"]  # binding 0.0.0.0 inside the container is intended

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
